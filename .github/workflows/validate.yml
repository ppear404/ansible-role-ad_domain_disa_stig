---
name: Validate Ansible role

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Validate role and example inventory
        run: |
          ansible-playbook -i inventory.example.yml tests/test.yml --syntax-check
          ansible-playbook -i inventory.example.yml tests/evaluate.yml --syntax-check
          ansible-playbook -i inventory.example.yml tests/test.yml --limit pdc --list-hosts
          ansible-lint --offline
          python -m py_compile tests/build_answer_file.py
