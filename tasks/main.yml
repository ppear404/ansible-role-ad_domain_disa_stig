---
- name: Verify the development controller
  ansible.builtin.import_tasks: preflight.yml
  tags: [always]

- name: Apply privileged directory account controls
  ansible.builtin.import_tasks: privileged_accounts.yml

- name: Apply domain Kerberos auditing
